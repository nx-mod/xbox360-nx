# A worker thread's wait for work spins without resting (src/halo3_hooks.cpp explains it). The hook sleeps
# 100 us on each repeat of the loop: 0x821A85C4 is only reached when the first look found nothing.
[[midasm_hook]]
address = 0x821A85C4
name = "Halo3WorkerPollYield"

# Direct3D's fence check (sub_825A7EC8: the device's fence write-back at +10896, flags at +10941) spins 4 x 8
# db16cyc per call and its caller calls it again until the GPU has passed the fence, so the RENDER thread kept a
# whole core (51 % of its stack samples in that loop, 92 % CPU) at the priority of every other game thread, the
# audio mixer included. db16cyc is simde_mm_pause here, which does not give the core away. 0x825A7F1C is the first
# instruction after the pause loop: one sleep per poll, as Halo3WorkerPollYield.
[[midasm_hook]]
address = 0x825A7F1C
name = "Halo3FenceSpinYield"

# XAudio's spin barrier (sub_826C61C8): each of its mixing threads sets its byte in a shared 64-bit word (by the
# hardware thread number at r13+268) and spins with db16cyc until every participant's byte is there. On three cores
# a waiting worker kept its core while its partner waited for one (the raised audio thread, 0x3A, at 92.7 % CPU in
# this loop; the menu and movies still 1,100-1,350 frames short in 10 s). 0x826C62AC is the db16cyc, reached only
# while the barrier is not complete.
[[midasm_hook]]
address = 0x826C62AC
name = "Halo3AudioBarrierYield"
