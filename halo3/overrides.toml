# ============================================================================
#  Halo 3 - manual declarations for the codegen
#
#  Included from halo3_manifest.toml via includes = ["overrides.toml"].
#  Included files use the flat schema (sections at the root). See
#  nfsmw_pal/overrides.toml for every field, explained.
#
#  Loose keys (cr_as_local and the like) must go above the first [table]:
#  in TOML a loose key belongs to the last table opened.
#
# ============================================================================

# Registers as C++ locals (docs/toolchain.md): the compiler keeps cr, xer, ctr and r14-r31 in the Switch's own
# registers, and the calls to __savegprlr_N/__restgprlr_N (in every prologue and epilogue) are dropped. The pieces
# that read registers their owner set up are marked share_registers in [functions] below.
# setjmp (sub_826F3AF0, six callers in the XDK's libraries) then saves zeros; its longjmp returns to its caller
# instead of to the setjmp in recompiled code anyway.
cr_as_local = true
non_volatile_as_local = true
xer_as_local = true
ctr_as_local = true

[functions]
# Reached only by a tail call (a plain `b`), which the analysis does not follow into a new function.
# Both are function starts in XenonAnalyse's map of the same default.xex (0x826CC8A0: 8 bytes, 0x826C5118: 40).
"0x826CC8A0" = {}   # from b at 0x826CEF7C
"0x826C5118" = {}   # from b at 0x826C49F4
"0x8258BDA0" = {}   # from b at 0x8258C094 (8 bytes into 0x8258BD98)
"0x825A2180" = {}   # from b at 0x8259FE40 (16 bytes into 0x825A2170): SwitchToFiber's body, unused once hooked ([rexcrt])


# Pieces that read registers (r14-r31, f14-f31, cr, ctr, xer) before writing them: with those registers as
# locals they would read zeros. Found by a lee_antes.py-style pass over the generated code (false alarms dropped:
# mfcr saves, a prologue's stores, vcmp. writes). Run it again after a codegen that changes them.
# Reached only by a tail jump (b, bctr) from the function that set the registers up:
